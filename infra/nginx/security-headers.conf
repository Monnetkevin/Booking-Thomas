# En-têtes de sécurité, inclus dans le bloc server ET dans chaque location qui a son propre
# add_header : Nginx n'hérite pas des add_header du niveau supérieur dans ce cas (#136).
# Installé dans /etc/nginx/snippets/booking-security-headers.conf.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

# Content-Security-Policy de la SPA :
#   script-src / frame-src  Cloudflare Turnstile (formulaires de contact et de réservation)
#   style-src 'unsafe-inline'  attributs style de React et de Leaflet (carte)
#   img-src  photos du site, tuiles OpenStreetMap de la carte, images data:/blob: de Leaflet
# Jalon 11 (paiement) : ajouter https://js.stripe.com à script-src et frame-src,
# https://api.stripe.com à connect-src, si le paiement est intégré à la page.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
