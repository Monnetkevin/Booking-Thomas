# Booking Thomas — site public (SPA React), back-office et API Laravel sous un seul domaine.
# Installé sur le VPS au jalon « Qualité et mise en ligne » (#67) ; certificats Let's Encrypt (Certbot).
#   /                      fichiers de la SPA (frontend/dist), toute route inconnue → index.html
#   /api, /sanctum         API Laravel (PHP-FPM)
#   /sitemap.xml, /robots.txt  générés par Laravel
#   /ical/{token}.ics      calendrier d'un logement lu par Airbnb (Laravel)
#   /storage               photos publiques (WebP/AVIF), cache long

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    root /var/www/booking/current/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 210m; # envoi de photos depuis le back-office (10 × 20 Mo)

    # En-têtes de sécurité (la Content-Security-Policy complète est réglée au jalon 8, #61)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Fichiers versionnés par Vite (nom avec empreinte) : cache d'un an
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Photos publiques des logements
    location /storage/ {
        alias /var/www/booking/current/backend/storage/app/public/;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # API, authentification de la SPA, plan du site : PHP-FPM
    location ~ ^/(api|sanctum)/ {
        try_files /nonexistent @laravel;
    }
    location = /sitemap.xml { try_files /nonexistent @laravel; }
    location = /robots.txt  { try_files /nonexistent @laravel; }
    location ^~ /ical/      { try_files /nonexistent @laravel; }

    location @laravel {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/booking/current/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/booking/current/backend/public;
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_read_timeout 60s;
    }

    # Toute autre route est une page de la SPA (/, /logements/le-cocon, /en/contact, /admin…)
    location / {
        try_files $uri /index.html;
        # index.html ne doit jamais rester en cache : il référence les nouveaux fichiers à chaque déploiement
        location = /index.html {
            add_header Cache-Control "no-cache";
        }
    }

    location ~ /\.(?!well-known) {
        deny all;
    }
}
