# Environnement de développement local. La SPA tourne sur la machine hôte (npm run dev)
# et relaie /api et /sanctum vers le service app.
# Ports publiés sur la machine réglables dans un fichier .env à la racine (à côté de ce
# fichier), pour faire tourner plusieurs projets en même temps, ex. MAILPIT_UI_PORT=8027.
services:
  app:
    build:
      context: infra/docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  queue:
    build:
      context: infra/docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Conversions de photos, e-mails, synchronisation iCal
    command: php artisan queue:work --tries=3 --timeout=300
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./infra/docker/pgsql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${PGSQL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Laravel envoie ses e-mails à mailpit:1025 par le réseau Docker : seule l'interface web
  # est publiée sur la machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgsql-data:
