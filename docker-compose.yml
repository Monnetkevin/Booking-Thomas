# Environnement de développement local : `docker compose up -d` puis http://localhost:5173.
# Le service frontend (Vite) relaie /api, /sanctum, le plan du site et robots.txt vers app.
# Ports publiés sur la machine réglables dans un fichier .env à la racine (à côté de ce
# fichier), pour faire tourner plusieurs projets en même temps, ex. MAILPIT_UI_PORT=8027.
services:
  app:
    build:
      context: infra/docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - ./backend:/var/www/backend
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  # SPA React servie par Vite (rechargement à chaud). Ses node_modules restent dans un
  # volume Docker, séparés de ceux de la machine.
  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY_TARGET: http://app:8000
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - app

  queue:
    build:
      context: infra/docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Conversions de photos, e-mails, synchronisation iCal
    command: php artisan queue:work --tries=3 --timeout=300
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  scheduler:
    build:
      context: infra/docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    # Tâches planifiées (cron en production) : expiration des réservations non payées…
    command: php artisan schedule:work
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      pgsql:
        condition: service_healthy
      redis:
        condition: service_started

  pgsql:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: booking
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: secret
    volumes:
      - pgsql-data:/var/lib/postgresql/data
      - ./infra/docker/pgsql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "${PGSQL_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d booking"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Laravel envoie ses e-mails à mailpit:1025 par le réseau Docker : seule l'interface web
  # est publiée sur la machine.
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"

volumes:
  pgsql-data:
  frontend-node-modules:
